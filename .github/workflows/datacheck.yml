# Test-only workflow; never included in the upstream implementation PR.
name: C++ datacheck regression suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'eeffaann/HighwayData'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: HighwayData
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: TravelMapping/DataProcessing
          ref: 92db014f52f9e6021aba5f697cc98d9daa924e0f
          path: DataProcessing
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: TravelMapping/UserData
          path: UserData
          persist-credentials: false
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libc++-dev libc++abi-dev make libfmt-dev
      - name: Build pinned C++ site update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p suite-results
          make -C DataProcessing/siteupdate/cplusplus -j 2 \
            CXX='clang++ -stdlib=libc++' siteupdate \
            2>&1 | tee suite-results/build.log
      - name: Run original fixtures and assert outcomes
        shell: bash
        run: bash HighwayData/.github/scripts/cpp-datacheck-suite.sh
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-regression-results
          retention-days: 7
          if-no-files-found: error
          path: |
            suite-results/build.log
            suite-results/results.tsv
            suite-results/summary.md
            suite-results/*/revisions.txt
            suite-results/*/console.log
            suite-results/*/assertions.log
            suite-results/*/matched-diagnostics.log
            suite-results/*/logs/datacheck.log
            suite-results/*/logs/nearmisspoints.log
            suite-results/*/logs/tm-master.nmp
            suite-results/*/logs/nmpfpsunmatched.log
            suite-results/*/logs/unmatchedfps.log
            suite-results/*/logs/nearmatchfps.log
            suite-results/*/logs/unprocessedwpts.log
