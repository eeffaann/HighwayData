name: Highway data check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      data_ref:
        description: 'HighwayData branch or commit to check (blank uses the workflow ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datacheck:
    if: github.repository == 'eeffaann/HighwayData'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out highway data
        uses: actions/checkout@v7
        with:
          path: HighwayData
          ref: ${{ inputs.data_ref || github.sha }}
          persist-credentials: false

      - name: Check out DataProcessing
        uses: actions/checkout@v7
        with:
          repository: TravelMapping/DataProcessing
          ref: 92db014f52f9e6021aba5f697cc98d9daa924e0f
          path: DataProcessing
          persist-credentials: false

      - name: Check out UserData
        uses: actions/checkout@v7
        with:
          repository: TravelMapping/UserData
          path: UserData
          persist-credentials: false

      - name: Install C++ datacheck dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfmt-dev

      - name: Build C++ datacheck
        run: make -C DataProcessing/siteupdate/cplusplus -j2 siteupdate

      - name: Run datacheck
        shell: bash
        run: |
          mkdir -p datacheck/logs/users datacheck/logs/nmpbyregion datacheck/stats
          # The pinned C++ checker still expects the former data directory name.
          ln -s hwy_data HighwayData/data
          {
            for repo in HighwayData DataProcessing UserData; do
              printf '%s @ ' "$repo"
              git -C "$repo" rev-parse HEAD
            done
            DataProcessing/siteupdate/cplusplus/siteupdate \
              -e -k -t 2 \
              -w HighwayData \
              -u UserData/list_files \
              -l datacheck/logs \
              -c datacheck/stats
          } 2>&1 | tee datacheck/console.log
          grep -Fq '!!! DATA CHECK SUCCESSFUL !!!' datacheck/console.log

      - name: Upload datacheck results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datacheck-results
          path: datacheck/
          retention-days: 14
